<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RB2R — Audio test bench</title>
    <link rel="icon" href="data:," />
    <style>
      body { font: 14px/1.4 system-ui, sans-serif; background: #1d1a15; color: #e8dcc0; margin: 0; padding: 16px 24px; }
      h1 { font-size: 20px; margin: 0 0 12px; }
      h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.08em; color: #c9a86a; margin: 18px 0 6px; }
      section { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
      button { background: #3b3326; color: #f3e6c8; border: 1px solid #6b5a3c; padding: 5px 10px; border-radius: 3px; cursor: pointer; }
      button:hover { background: #4d4230; }
      button.active { background: #7a5b22; }
      label { display: inline-flex; gap: 6px; align-items: center; }
      input[type=range] { width: 140px; }
      #meter { height: 10px; width: 300px; background: #333; position: relative; }
      #meter > div { position: absolute; left: 0; top: 0; bottom: 0; background: #b5883a; width: 0; }
      #status { color: #9f9; font-family: ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <h1>Red Baron II: Reloaded — audio bench</h1>
    <section>
      <button id="start">▶ Start audio</button>
      <span id="status">suspended</span>
      <div id="meter"><div></div></div>
    </section>
    <h2>Volumes</h2>
    <section id="volumes"></section>
    <h2>Music</h2>
    <section id="music"></section>
    <h2>Interface</h2>
    <section id="ui"></section>
    <h2>Player aircraft</h2>
    <section id="player"></section>
    <h2>Guns (hold to fire)</h2>
    <section id="guns"></section>
    <h2>Own aircraft events</h2>
    <section id="own"></section>
    <h2>World</h2>
    <section id="world"></section>
    <script type="module" src="../src/audio/dev/bench.ts"></script>
  </body>
</html>
