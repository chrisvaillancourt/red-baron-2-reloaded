<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World harness — Red Baron II: Reloaded</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font: 12px/1.4 ui-monospace, Menlo, monospace; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #panel { position: fixed; top: 8px; left: 8px; background: rgba(20, 18, 14, 0.78); color: #e8dfc8; padding: 8px 10px; border-radius: 6px; width: 250px; }
      #panel label { display: flex; justify-content: space-between; gap: 6px; margin: 3px 0; align-items: center; }
      #panel input, #panel select, #panel button { font: inherit; }
      #panel input[type=range] { width: 120px; }
      #stats { position: fixed; top: 8px; right: 8px; background: rgba(20, 18, 14, 0.78); color: #e8dfc8; padding: 6px 10px; border-radius: 6px; white-space: pre; }
      #panel.hidden { display: none; }
      .row { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="panel">
      <b>World harness</b> <small>(H hides)</small>
      <label>Date <input id="date" type="date" min="1915-07-01" max="1918-11-11" value="1917-06-01" /></label>
      <label>Time
        <select id="tod"><option>dawn</option><option selected>morning</option><option>midday</option><option>afternoon</option><option>dusk</option></select>
      </label>
      <label>Cloud cover <input id="cover" type="range" min="0" max="1" step="0.05" value="0.4" /></label>
      <label>Cloud base <input id="base" type="range" min="400" max="4000" step="50" value="1500" /></label>
      <label>Visibility <input id="vis" type="range" min="4000" max="60000" step="1000" value="30000" /></label>
      <label>Teleport <select id="tp"></select></label>
      <label>Altitude <input id="alt" type="number" value="800" step="100" style="width:80px" /></label>
      <label>Speed <input id="speed" type="range" min="10" max="2000" step="10" value="120" /></label>
      <div class="row">
        <button id="demo">Spawn effects demo</button>
        <button id="flak">Flak</button>
        <button id="boom">Explosion</button>
      </div>
      <small>Click canvas to look (pointer lock). WASD move, Q/E down/up, Shift ×5.</small>
    </div>
    <div id="stats"></div>
    <script type="module" src="/src/render/dev/worldHarness.ts"></script>
  </body>
</html>
